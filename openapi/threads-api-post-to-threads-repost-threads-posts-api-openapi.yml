openapi: 3.2.0
info:
  title: Post to Threads > Repost Threads Posts API
  description: The Threads API enables developers to build their own unique integrations, and helps creators and brands manage their Threads presence at scale and easily share inspiring content with their communities.
  version: 1.0.0
servers:
- url: http://{{api_host}}
security:
- oauth2Auth: []
tags:
- name: Post to Threads > Repost Threads Posts
  description: This folder will enable you to repost an original Threads post.
paths:
  /{thread_id}/repost:
    post:
      tags:
      - Post to Threads > Repost Threads Posts
      summary: Repost Threads Post
      description: Use the `POST` /{threads-user-id}/threads_publish endpoint to publish the container ID returned in the previous step.
      requestBody:
        content: {}
      parameters:
      - name: thread_id
        in: path
        schema:
          type: string
        required: true
      responses:
        undefined:
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                id: string
      operationId: postByThreadIdRepost
      x-operation-id-source: derived
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    oauth2Auth:
      type: http
      scheme: oauth2
