apis:
- aid: threads-api:threads-api-authorization-api
  name: Threads Authorization API
  description: >-
    Authorization is a required step to get the necessary user permissions to act on behalf of the user.
    Please take a look at the [walkthrough of the authentication process](https://developers.facebook.com/docs/threads/get-started/get-access-tokens-and-permissions).
    Once the access token is retrieved, use the [access token debugger](https://developers.facebook.com/tools/debug/accesstoken)
    to check if the access token has the correct permissions (including `threads_basic`, `threads_content_publish`,
    `threads_read_replies`, `threads_manage_replies`, `threads_manage_insights`) and verify that the access
    token hasn't expired.


    Follow the [documentation](https://developers.facebook.com/docs/threads/get-started/long-lived-tokens)
    to exchange a short-lived Threads User Access Token for a long-lived token and refresh unexpired long-lived
    Threads User Access tokens. **Note:** The `threads_basic` permission is sufficient for the exchange
    or refresh process.
  humanURL: https://developers.facebook.com/docs/threads/
  baseURL: https://graph.threads.net
  tags:
  - Authorization
